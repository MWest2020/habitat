# SPDX-License-Identifier: MIT
# Geparametriseerd worker-Job-manifest. Gerenderd door dispatch.sh via envsubst.
# Variabelen: JOB_NAME, HABITAT_ROLE, HABITAT_CHANGE, HABITAT_REPO, HABITAT_RUN_ID,
# HABITAT_MAX_BUDGET_USD, ACTIVE_DEADLINE_SECONDS, PAT_SECRET, WORKER_IMAGE,
# OAUTH_SECRET, CREDS_SECRET, API_KEY_SECRET (set by dispatch.sh from HABITAT_AUTH).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: agents
  labels:
    app.kubernetes.io/part-of: habitat
    habitat/component: worker
    habitat/role: ${HABITAT_ROLE}
    habitat/run-id: ${HABITAT_RUN_ID}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: ${ACTIVE_DEADLINE_SECONDS}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: habitat
        habitat/component: worker        # selecteert de worker-egress CiliumNetworkPolicy
        habitat/role: ${HABITAT_ROLE}
    spec:
      restartPolicy: Never
      serviceAccountName: role-${HABITAT_ROLE}
      automountServiceAccountToken: false
      # privé GHCR-image: pull-secret op elke rol-Job (weg te laten als het package publiek is)
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 10
      # A throwaway test database (change worker-test-database, 2026-10-24): a
      # native sidecar, so it starts before the worker, holds it until
      # pg_isready answers, and stops with it. Loopback only; the data is an
      # emptyDir and dies with the pod. Without it every DB test in a repo
      # skipped and the builder said PASS on tests it never ran (wordsworth#219).
      initContainers:
        - name: testdb
          image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
          restartPolicy: Always
          env:
            - { name: POSTGRES_PASSWORD, value: "habitat" }   # throwaway, loopback only
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          args: ["-c", "listen_addresses=127.0.0.1", "-c", "fsync=off"]
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: testdb-data, mountPath: /var/lib/postgresql/data }
            - { name: testdb-run, mountPath: /var/run/postgresql }
      containers:
        - name: worker
          image: ${WORKER_IMAGE}
          env:
            - { name: HABITAT_REPO,   value: "${HABITAT_REPO}" }
            - { name: HABITAT_ROLE,   value: "${HABITAT_ROLE}" }
            - { name: HABITAT_CHANGE, value: "${HABITAT_CHANGE}" }
            - { name: HABITAT_RUN_ID, value: "${HABITAT_RUN_ID}" }
            - { name: HABITAT_BASE_BRANCH, value: "${HABITAT_BASE_BRANCH}" }
            - { name: HABITAT_TASK_REF, value: "${HABITAT_TASK_REF}" }
            - { name: HABITAT_MAX_BUDGET_USD, value: "${HABITAT_MAX_BUDGET_USD}" }
            # the testdb sidecar; the second name is the one wordsworth's conftest reads
            - { name: HABITAT_TEST_DATABASE_URL, value: "postgresql+psycopg://postgres:habitat@127.0.0.1:5432/postgres" }
            - { name: WORDSWORTH_TEST_DATABASE_URL, value: "postgresql+psycopg://postgres:habitat@127.0.0.1:5432/postgres" }
            - name: GIT_PAT
              valueFrom:
                secretKeyRef: { name: ${PAT_SECRET}, key: GIT_PAT }
            # Langlevende subscription-auth (`claude setup-token`, 1 jaar).
            # optional: de Job start ook zonder dit Secret — dan valt de
            # entrypoint terug op de gemounte sessie-credentials.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${OAUTH_SECRET}
                  key: token
                  optional: true
            # API credits (change worker-api-auth): with HABITAT_AUTH=api dispatch
            # names the key's Secret here and an absent one for the two above,
            # so the entrypoint cannot fall back to the subscription.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${API_KEY_SECRET}
                  key: key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            # 150m en niet 250m: een run staat het grootste deel van zijn leven
            # te wachten op het model, niet te rekenen. De LIMIET blijft 2 CPU,
            # dus een build mag nog steeds alles pakken wat vrij is.
            # Aanleiding (2026-09-20): twee runs strandden zonder één regel
            # uitvoer, en de oorzaak was de planner, niet de build —
            # "0/6 nodes are available: 3 Insufficient cpu". De werknodes hebben
            # 1 CPU elk en waren voor ~750m vergeven.
            requests: { cpu: 150m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          volumeMounts:
            # sub-first auth: Claude-subscription-credentials read-only in de Job
            - { name: claude-creds, mountPath: /var/run/claude, readOnly: true }
      volumes:
        - { name: testdb-data, emptyDir: {} }
        - { name: testdb-run, emptyDir: {} }
        - name: claude-creds
          secret:
            secretName: ${CREDS_SECRET}
            # optional: met CLAUDE_CODE_OAUTH_TOKEN is dit Secret overbodig;
            # zonder deze regel zou het verwijderen ervan elke Job blokkeren.
            optional: true
            items:
              - { key: credentials.json, path: credentials.json }
